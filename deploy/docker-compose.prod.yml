services:
  # Memory budget: the server is an Oracle E2.1.Micro with 1 GB of RAM. The sum of the
  # limits (postgres 192 + strapi 384 + frontend 224 + nginx 64 = 864 MB) leaves ~160 MB
  # for the system and docker; the 2 GB swap from setup-swap.sh takes the rest (without
  # it the stack does not come up). The sum here was once computed with the old nginx
  # limit (32 MB) and nobody fixed it after the bump to 64 — and it is one of the few
  # numbers decisions here are made by.
  postgres:
    # The 16 -> 17 migration was done on 07.09.2026 by dump and restore, not by swapping
    # the image: Postgres refuses to start when the data directory was created by another
    # major. That is why 17 gets ITS OWN volume (_v17). The old 16 volume was the way back
    # during the grace period and was removed on 06.10.2026 — there is no way back to 16
    # any more. For the next major repeat this scheme: a new volume alongside, delete the
    # old one only after the grace period.
    image: postgres:17-alpine
    container_name: anovastudio-postgres-prod
    mem_limit: 192m
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=24MB"
      - "-c"
      - "work_mem=2MB"
      - "-c"
      - "effective_cache_size=64MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "maintenance_work_mem=16MB"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - anovastudio_postgres_data_prod_v17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # No process in a container may gain privileges it did not start with
    # (setuid binaries, file capabilities) — a cheap belt in case one is taken
    # over (audit, 26.10.2026). Postgres and nginx start as root and drop to
    # their own users, which this allows; checked on every image before adding.
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  strapi:
    image: ghcr.io/${GHCR_OWNER}/anovastudio-backend:${VERSION:-latest}
    container_name: anovastudio-strapi-prod
    mem_limit: 384m
    environment:
      NODE_ENV: production
      # Keep the V8 heap clearly below mem_limit — better GC than an OOM kill
      NODE_OPTIONS: "--max-old-space-size=300"
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Public origin of the Strapi API/admin (e.g. https://api.example.pl)
      PUBLIC_URL: ${STRAPI_PUBLIC_URL}
      IS_PROXIED: "true"
      TZ: Europe/Warsaw
    volumes:
      - anovastudio_uploads_prod:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:1337/_health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  frontend:
    image: ghcr.io/${GHCR_OWNER}/anovastudio-frontend:${VERSION:-latest}
    container_name: anovastudio-frontend-prod
    mem_limit: 224m
    environment:
      # Keep the V8 heap clearly below mem_limit; headroom for sharp (image optimisation)
      NODE_OPTIONS: "--max-old-space-size=160"
    volumes:
      # Processed photos from the Media Library. Without this volume the cache died with
      # the container, so after EVERY deploy all gallery photos were recomputed from zero —
      # with sharp, on one core and in 224 MB of memory.
      - anovastudio_image_cache_prod:/app/.next/cache
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      # service_started, NOT service_healthy: the frontend is written to survive an
      # unavailable CMS (lib/strapi.ts returns empty data, pages have empty states). With a
      # hard health condition a Strapi failure — real on 1 GB of RAM — took down the whole
      # site instead of taking the gallery and the team out of it.
      strapi:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.31-alpine
    container_name: anovastudio-nginx-prod
    # 32m died from the OOM killer on many parallel uploads to the Media Library
    # (27 photos at once over TLS/HTTP2) — 64m leaves headroom for connection buffers.
    mem_limit: 64m
    # IPv4 only. Without an address Docker publishes the ports on IPv6 too, and that path
    # bypasses the origin firewall (deploy/origin-firewall.sh), which filters IPv4.
    # Cloudflare connects to the server over IPv4 — the domain's records are A records.
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot:ro
    depends_on:
      - frontend
      - strapi
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  anovastudio_postgres_data_prod_v17:
  anovastudio_uploads_prod:
  anovastudio_image_cache_prod:
