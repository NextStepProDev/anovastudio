# Reverse proxy dla Anova Studio.
#
# Domena: anovastudio.pl (DNS w Cloudflare, rekordy A na razie "DNS only").
# Certyfikat Let's Encrypt obejmuje domenę główną, www i api (certbot -d ... x3).
#
# Architektura: frontend (Next.js) na domenie głównej, Strapi w całości na
# subdomenie api.* — panel admina Strapi używa wielu ścieżek root-level
# (/content-manager, /upload, /users-permissions, ...), więc rozdzielenie po
# hostach jest jedynym stabilnym routingiem.

# Anty-brute-force: bufor limitów per-IP dla endpointów logowania (poniżej).
# Deklaracja w http-context (ten plik jest include'owany w bloku http nginx.conf).
# Świadomie WĄSKI zakres — tylko ścieżki logowania — żeby nie dotknąć uploadów
# do Media Library (27 zdjęć naraz) ani ładowania assetów panelu.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# HTTP: ACME challenge + redirect na HTTPS
server {
    listen 80;
    server_name anovastudio.pl www.anovastudio.pl api.anovastudio.pl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend — Next.js
server {
    listen 443 ssl;
    http2 on;
    server_name anovastudio.pl www.anovastudio.pl;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS hardening — tylko nowoczesne protokoły + preferencje serwera dla TLS1.2
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Nie ujawniaj wersji nginx w nagłówku Server ani na stronach błędów
    server_tokens off;

    # Nagłówki bezpieczeństwa (always = także na odpowiedziach błędów)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Strapi — API + panel admina
server {
    listen 443 ssl;
    http2 on;
    server_name api.anovastudio.pl;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS hardening (spójne z blokiem frontendu)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # HSTS także dla subdomeny API/panelu. Reszty nagłówków (X-Frame-Options,
    # CSP itd.) świadomie NIE dubluje — panel admina Strapi ustawia własne
    # przez helmet (strapi::security); dokładanie ich w nginx potrafi kolidować.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Limit spójny z konfiguracją uploadu Strapi (backend/config/plugins.ts)
    client_max_body_size 25m;

    # Generowanie wariantów obrazów (sharp) na 1 OCPU trwa dłużej niż domyślne
    # 60 s — bez tego uploady w Media Library kończą się 504 mimo sukcesu w tle.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Rate-limit logowania do panelu (5/min, burst 10) — reszta ścieżek /admin
    # (assety, content-manager) bez limitu, żeby nie dławić pracy w panelu.
    location = /admin/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://strapi:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin/register-admin {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://strapi:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Logowanie/rejestracja przez users-permissions (API publiczne)
    location /api/auth/ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://strapi:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://strapi:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pliki z Media Library — cache po stronie przeglądarki
    location /uploads/ {
        proxy_pass http://strapi:1337;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
