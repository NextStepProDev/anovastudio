# Reverse proxy for Anova Studio.
#
# Domain: anovastudio.pl (DNS in Cloudflare, proxied A records — the orange cloud; the
# server accepts 80/443 only from Cloudflare, deploy/origin-firewall.sh).
# The Let's Encrypt certificate covers the apex, www and api (certbot -d ... x3).
#
# Architecture: the frontend (Next.js) on the apex, Strapi entirely on the api.*
# subdomain — the Strapi admin panel uses many root-level paths (/content-manager,
# /upload, /users-permissions, ...), so splitting by host is the only stable routing.

# Anti-brute-force: a per-IP limit zone for the login endpoints (below).
# Declared in the http context (this file is included in nginx.conf's http block).
# Deliberately NARROW — login paths only — so as not to touch uploads to the Media
# Library (27 photos at once) or the loading of the panel's assets.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# The visitor's real address from behind Cloudflare. Without it $remote_addr is the
# Cloudflare server's address, so the login limit above counted every visitor from one
# Cloudflare location as one person: five foreign mistakes locked the login for everyone.
# The same list (IPv4 ranges) drives the origin firewall (deploy/setup-origin-firewall.sh
# cuts it out of here).
# Source: https://www.cloudflare.com/ips — compare on changes.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# HTTP: ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name anovastudio.pl www.anovastudio.pl api.anovastudio.pl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www → apex (301). The certificate covers www, so TLS here must be complete — the
# browser connects BEFORE it sees the redirect.
#
# Before, both hosts served the same site with 200. `rel=canonical` pointing at the apex
# saved it, but Google still indexed two addresses and had to guess which one was right —
# and incoming links split across two domains. A 301 settles it unambiguously and passes
# the link equity to the apex.
server {
    listen 443 ssl;
    http2 on;
    server_name www.anovastudio.pl;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # HSTS on the redirect too — otherwise the www subdomain stays without the header,
    # and `includeSubDomains` from the apex works only after the apex has been visited.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 301 https://anovastudio.pl$request_uri;
}

# Frontend — Next.js
server {
    listen 443 ssl;
    http2 on;
    server_name anovastudio.pl;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS hardening — modern protocols only + server preference for TLS1.2
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Do not reveal the nginx version in the Server header or on error pages
    server_tokens off;

    # Security headers (always = on error responses too)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content Security Policy. Strapi sends its own (helmet), the frontend had none.
    # The scope follows what the site actually uses:
    #  • 'unsafe-inline' in script-src — Next injects hydration data and JSON-LD in
    #    <script> tags without a nonce,
    #  • 'unsafe-inline' in style-src — Tailwind and Motion set inline styles,
    #  • frame-src — the embedded Google map on /kontakt,
    #  • img-src with data: and blob: — the grain and masks in SVG and next/image previews.
    # Deliberately NO upgrade-insecure-requests: everything goes over HTTPS anyway.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Photos and logos from public/ — Next serves them with max-age=0, so without this the
    # browser asked for every hero frame on every visit. A week + a day of serving the stale
    # version in the background; file names carry no hash, so deliberately NO `immutable`
    # (see the comment in frontend/next.config.ts).
    location ~* ^/(images|logo)/ {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Its own add_header kills inheritance from the server block, so the security
        # headers have to be repeated here — otherwise image files would lose HSTS and
        # nosniff.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Strapi — API + admin panel
server {
    listen 443 ssl;
    http2 on;
    server_name api.anovastudio.pl;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS hardening (consistent with the frontend block)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # HSTS for the API/panel subdomain too. The rest of the headers (X-Frame-Options, CSP
    # etc.) are deliberately NOT duplicated — the Strapi admin panel sets its own through
    # helmet (strapi::security); adding them in nginx can collide.
    #
    # Strapi sends its own HSTS (a year, no `preload`), so without hiding it the response
    # carried the header TWICE — and the browser takes the first, i.e. the weaker one,
    # and nginx's version was dead.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Limit consistent with Strapi's upload configuration (backend/config/plugins.ts)
    client_max_body_size 25m;

    # Generating image variants (sharp) on 1 OCPU takes longer than the default 60 s —
    # without this, Media Library uploads end in 504 despite succeeding in the background.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Rate limit on the panel login (5/min, burst 10) — the other /admin paths (assets,
    # content-manager) unlimited, so as not to throttle work in the panel.
    location = /admin/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://strapi:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin/register-admin {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://strapi:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login/registration through users-permissions (public API)
    location /api/auth/ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://strapi:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://strapi:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Files from the Media Library — browser-side cache. File names given by Strapi
    # contain a hash, so the content under an address never changes and `immutable` is
    # safe here.
    #
    # ONE merged Cache-Control: before, `expires 30d` and `add_header` sent this header
    # twice, with different values. Security headers repeated, because its own add_header
    # in a location kills inheritance from the server block.
    location /uploads/ {
        proxy_pass http://strapi:1337;
        proxy_set_header Host $host;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Cache-Control;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
}
