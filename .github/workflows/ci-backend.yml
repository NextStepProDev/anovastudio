name: CI Backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - VERSION
      - .github/workflows/ci-backend.yml
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - VERSION
      - .github/workflows/ci-backend.yml

# Cancel superseded PR runs to save minutes, but NEVER cancel main-branch runs:
# each push may bump VERSION and its docker job must build+push that image, or
# the deploy pulls a tag that doesn't exist. Pushes on main queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Informacyjnie — i tu, w odróżnieniu od frontendu, musi takie zostać.
      # Zawężone do zależności produkcyjnych zostają DWA zgłoszenia „high":
      # `js-yaml` (poprawka tylko w 5.x, bez backportu do 4.x) i `vite`
      # (poprawka od 6.4.3 w górę). Oba siedzą w drzewie samego Strapiego —
      # wymuszenie majora przez `overrides` łamie budowanie panelu admina,
      # więc znikną dopiero z podbiciem @strapi/strapi. Reszta, którą DAŁO się
      # domknąć bez majora, jest już domknięta w `overrides` w package.json.
      # ⚠️ Te overrides trzeba rewidować: przypinały `^3.1.4` i `^5.0.8`, czyli
      # wersje, które same zdążyły stać się podatne, i audyt cicho świecił na
      # czerwono mimo „załatanego" pliku.
      - name: npm audit (produkcyjne, high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npm run build

  docker:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/anovastudio-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Skan CVE w warstwie systemowej obrazu (czego npm audit nie widzi).
      # Informacyjnie na razie (exit-code 0 = nie blokuje deployu). ignore-unfixed
      # ucina szum z podatności bez łatki; zostają te naprawialne bumpem bazy.
      # Gdy wyniki będą czyste, ustaw exit-code na 1, by high/critical wywalały build.
      - name: Trivy image scan (high+)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Nazwa obrazu musi być lowercase (owner NextStepProDev ma wielkie litery,
          # a OCI reference wymaga małych — metadata-action lowercase'uje sam przy pushu).
          image-ref: ghcr.io/nextstepprodev/anovastudio-backend:${{ steps.version.outputs.version }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
