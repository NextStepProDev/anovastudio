name: CI Backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - VERSION
      - .github/workflows/ci-backend.yml
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - VERSION
      - .github/workflows/ci-backend.yml

# Cancel superseded PR runs to save minutes, but NEVER cancel main-branch runs:
# each push may bump VERSION and its docker job must build+push that image, or
# the deploy pulls a tag that doesn't exist. Pushes on main queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; only the job that pushes the image may write packages
# (audit, 26.10.2026 — the build job runs code from pull requests and has no
# business with the registry).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Must match `FROM node:<version>-alpine` in backend/Dockerfile.
          # Dependabot bumps only that one (the docker ecosystem reads Dockerfiles)
          # and nobody touches this number — after the 24 → 26 bump in #30 CI stayed
          # on 24 and for a while tested the code on a different version than
          # production runs. On the next Node major change BOTH places at once.
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # BLOCKING since 2026-11-19 (audit). Until then it ran with continue-on-error
      # "because Strapi's own tree always has something", and so guarded nothing:
      # 30 high advisories piled up, most of them fixable by a Strapi patch release.
      # scripts/audit-gate.mjs fails on any high/critical in production
      # dependencies except the advisories it lists with a reason (and fails on an
      # entry that no longer matches, so an exception cannot outlive its cause).
      # ⚠️ The `overrides` in package.json need revisiting on every Strapi bump:
      # they once pinned `^3.1.4` and `^5.0.8`, versions that had become
      # vulnerable themselves, while the file looked "patched".
      - name: npm audit (production, high+, with listed exceptions)
        run: npm run audit
      - run: npm run build

  docker:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/anovastudio-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # CVE scan of the image's system layer (what npm audit does not see).
      # Informational for now (exit-code 0 = does not block the deploy). ignore-unfixed
      # cuts the noise of vulnerabilities without a patch; what stays can be fixed by
      # bumping the base image. Once the results are clean, set exit-code to 1 so
      # high/critical fail the build.
      - name: Trivy image scan (high+)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # The image name must be lowercase (the owner NextStepProDev has capitals, and an
          # OCI reference requires lowercase — metadata-action lowercases on push by itself).
          image-ref: ghcr.io/nextstepprodev/anovastudio-backend:${{ steps.version.outputs.version }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
