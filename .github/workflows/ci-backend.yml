name: CI Backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - VERSION
      - .github/workflows/ci-backend.yml
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - VERSION
      - .github/workflows/ci-backend.yml

# Cancel superseded PR runs to save minutes, but NEVER cancel main-branch runs:
# each push may bump VERSION and its docker job must build+push that image, or
# the deploy pulls a tag that doesn't exist. Pushes on main queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; only the job that pushes the image may write packages
# (audit, 26.10.2026 — the build job runs code from pull requests and has no
# business with the registry).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Musi zgadzać się z `FROM node:<wersja>-alpine` w backend/Dockerfile.
          # Dependabot podbija tylko tam (ekosystem docker czyta Dockerfile'e),
          # tej liczby nie rusza nikt — po bumpie 24 → 26 w #30 CI został na
          # 24 i przez chwilę testował kod na innej wersji, niż obsługuje
          # produkcję. Przy następnym majorze Node zmienić OBA miejsca naraz.
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Informacyjnie — i tu, w odróżnieniu od frontendu, musi takie zostać.
      # Zawężone do zależności produkcyjnych zostają DWA zgłoszenia „high":
      # `js-yaml` (poprawka tylko w 5.x, bez backportu do 4.x) i `vite`
      # (poprawka od 6.4.3 w górę). Oba siedzą w drzewie samego Strapiego —
      # wymuszenie majora przez `overrides` łamie budowanie panelu admina,
      # więc znikną dopiero z podbiciem @strapi/strapi. Reszta, którą DAŁO się
      # domknąć bez majora, jest już domknięta w `overrides` w package.json.
      # ⚠️ Te overrides trzeba rewidować: przypinały `^3.1.4` i `^5.0.8`, czyli
      # wersje, które same zdążyły stać się podatne, i audyt cicho świecił na
      # czerwono mimo „załatanego" pliku.
      - name: npm audit (produkcyjne, high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npm run build

  docker:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/anovastudio-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Skan CVE w warstwie systemowej obrazu (czego npm audit nie widzi).
      # Informacyjnie na razie (exit-code 0 = nie blokuje deployu). ignore-unfixed
      # ucina szum z podatności bez łatki; zostają te naprawialne bumpem bazy.
      # Gdy wyniki będą czyste, ustaw exit-code na 1, by high/critical wywalały build.
      - name: Trivy image scan (high+)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Nazwa obrazu musi być lowercase (owner NextStepProDev ma wielkie litery,
          # a OCI reference wymaga małych — metadata-action lowercase'uje sam przy pushu).
          image-ref: ghcr.io/nextstepprodev/anovastudio-backend:${{ steps.version.outputs.version }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
