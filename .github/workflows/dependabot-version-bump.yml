name: Dependabot VERSION bump

# Version Guard wymaga, żeby PR ruszający kod aplikacji podbijał VERSION —
# inaczej merge nadpisałby istniejący tag obrazu w GHCR inną zawartością.
# Dependabot o tym pliku nie wie i wiedzieć nie będzie: umie podmienić wersje
# w package.json i package-lock.json, i tyle. Bez tego workflow KAŻDY jego PR
# dotykający frontend/ lub backend/ wymaga ręcznego commita.
#
# Dwa triggery, bo jeden nie wystarcza:
#
#  * pull_request_target — podbija numer, gdy PR powstaje lub się odświeża.
#    (Nie pull_request: przy PR-ach Dependabota GITHUB_TOKEN jest read-only
#    i nie da się nic wypchnąć. Gałęzie Dependabota leżą w tym samym repo,
#    a job nie uruchamia NICZEGO z kodu PR-a — czyta VERSION i commituje.)
#
#  * push na main — bo dwa PR-y otwarte równolegle policzą ten SAM następny
#    numer. Po zmergowaniu pierwszego drugi ma numer zajęty, ale git nie widzi
#    konfliktu (obie strony wpisały identyczną wartość), więc Dependabot się
#    nie odświeża, kontrolki się nie przeliczają i PR zostaje z nieaktualnym
#    zielonym. Merge takiego PR-a nadpisuje obraz poprzedniego — dokładnie ta
#    awaria, przed którą stoi Version Guard. Ten trigger przelicza numery
#    wszystkim otwartym PR-om Dependabota po każdym merge'u.

on:
  pull_request_target:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  # Wszystkie podbicia szeregowo: równoległe przebiegi liczyłyby ten sam numer.
  group: dependabot-version-bump
  cancel-in-progress: false

jobs:
  bump-this-pr:
    name: Bump VERSION on a Dependabot PR
    if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Świadomie main, nie gałąź PR-a: skrypt powstał później niż otwarte
      # gałęzie Dependabota, więc na nich go po prostu nie ma. Przełączenie na
      # gałąź robi sam skrypt, już po skopiowaniu się poza drzewo robocze.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPENDABOT_BUMP_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Stage the bump script outside the work tree
        run: cp .github/scripts/bump-pr-version.sh "$RUNNER_TEMP/bump.sh"
      # Blok (|), nie jedna linia: wartość zaczynająca się od cudzysłowu jest
      # dla YAML-a domkniętym napisem, a wszystko po nim błędem składni —
      # i wtedy CAŁY workflow przestaje się parsować.
      - run: |
          "$RUNNER_TEMP/bump.sh" '${{ github.event.pull_request.head.ref }}'

  rebump-open-prs:
    name: Re-bump open Dependabot PRs after a merge
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPENDABOT_BUMP_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Stage the bump script outside the work tree
        # Skrypt przełącza drzewo robocze na gałąź PR-a, a tam tego pliku nie
        # ma — przy drugim obiegu pętli ścieżka względna przestawała istnieć
        # ("No such file or directory") i podbicie leciało tylko dla pierwszego
        # PR-a. Kopia poza repozytorium jest odporna na przełączanie gałęzi.
        run: cp .github/scripts/bump-pr-version.sh "$RUNNER_TEMP/bump.sh"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BRANCHES=$(gh pr list --state open --author 'app/dependabot' \
            --json headRefName,files \
            --jq '.[] | select(any(.files[].path; startswith("frontend/") or startswith("backend/"))) | .headRefName')

          if [ -z "$BRANCHES" ]; then
            echo "Brak otwartych PR-ów Dependabota dotykających kodu aplikacji."
            exit 0
          fi

          # Jeden zepsuty PR nie może zablokować podbicia pozostałych.
          FAILED=0
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            "$RUNNER_TEMP/bump.sh" "$branch" || { echo "::warning::Nie udało się podbić $branch"; FAILED=1; }
          done <<< "$BRANCHES"

          exit $FAILED
