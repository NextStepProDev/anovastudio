name: Version Guard

# Obrazy w GHCR są tagowane wartością z pliku VERSION (`type=raw` w ci-*.yml),
# a deploy.yml pinuje dokładnie ten tag. Merge zmieniający kod aplikacji bez
# podbicia VERSION NADPISUJE istniejący tag inną zawartością — po cichu, bo CI
# jest wtedy zielone. Tag przestaje cokolwiek znaczyć i rollback nie ma dokąd
# wrócić. Zdarzyło się to naprawdę: trzy merge'e Dependabota (w tym major bump
# `motion` 12 → 13) wjechały pod istniejący tag 1.8.0.
#
# Bramka zamienia tę cichą awarię w czerwony PR, zanim cokolwiek trafi na main.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version-bumped:
    name: VERSION bumped alongside app changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Pełna historia — bez niej base.sha nie istnieje lokalnie i diff pada.
          fetch-depth: 0

      - name: Require a VERSION bump when app code changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)
          # grep -c zwraca 1 przy zero trafień, więc || true — inaczej set -e
          # ubija krok na PR-ze, który po prostu nie rusza aplikacji.
          APP_FILES=$(printf '%s\n' "$CHANGED" | grep -E '^(frontend|backend)/' || true)

          if [ -z "$APP_FILES" ]; then
            echo "Brak zmian w frontend/ ani backend/ — bump VERSION niepotrzebny."
            exit 0
          fi

          # Porównanie z AKTUALNYM main, nie z base.sha sprzed otwarcia PR-a.
          # "VERSION jest w diffie" nie wystarcza: dwa PR-y otwarte równolegle
          # podbijają do tego samego numeru, a po merge'u pierwszego drugi ma
          # ten numer zajęty — mimo że w jego diffie plik nadal figuruje.
          # Git nie zgłosi tam konfliktu (obie strony wpisały tę samą wartość),
          # więc jedyne, co to łapie, to wymóg bycia ostro przed main.
          git fetch origin main --quiet
          MAIN_VERSION=$(git show origin/main:VERSION | tr -d '[:space:]')
          PR_VERSION=$(tr -d '[:space:]' < VERSION)

          HIGHEST=$(printf '%s\n%s\n' "$MAIN_VERSION" "$PR_VERSION" | sort -V | tail -1)
          if [ "$HIGHEST" = "$PR_VERSION" ] && [ "$MAIN_VERSION" != "$PR_VERSION" ]; then
            echo "OK: kod aplikacji zmieniony, VERSION $PR_VERSION wyprzedza main ($MAIN_VERSION)."
            exit 0
          fi

          {
            echo "Ten PR zmienia kod aplikacji, ale jego VERSION ($PR_VERSION) nie wyprzedza"
            echo "wersji na main ($MAIN_VERSION)."
            echo
            echo "CI taguje obrazy wartością z VERSION, więc merge nadpisałby istniejące"
            echo "obrazy $MAIN_VERSION w GHCR inną zawartością. Tag, który pinuje deploy.yml,"
            echo "przestaje cokolwiek znaczyć, a rollback nie ma dokąd wrócić."
            echo
            echo "Napraw: podbij VERSION w tym PR-ze (patch przy bumpach zależności i fixach,"
            echo "minor przy nowej funkcji)."
            echo
            echo "Zmienione pliki aplikacji:"
            printf '%s\n' "$APP_FILES" | sed 's/^/  /'
          } | tee /tmp/guard-message.txt

          echo "::error title=Podbij VERSION::VERSION $PR_VERSION nie wyprzedza main ($MAIN_VERSION) — merge nadpisałby ten tag w GHCR."
          exit 1

      - name: Summary
        if: always()
        run: |
          if [ -f /tmp/guard-message.txt ]; then
            {
              echo "### ❌ Version Guard"
              echo
              echo '```'
              cat /tmp/guard-message.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Version Guard" >> "$GITHUB_STEP_SUMMARY"
          fi
