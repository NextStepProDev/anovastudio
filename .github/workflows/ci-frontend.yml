name: CI Frontend

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - VERSION
      - .github/workflows/ci-frontend.yml
  pull_request:
    branches: [main]
    paths:
      - frontend/**
      - VERSION
      - .github/workflows/ci-frontend.yml

# Cancel superseded PR runs to save minutes, but NEVER cancel main-branch runs:
# each push may bump VERSION and its docker job must build+push that image, or
# the deploy pulls a tag that doesn't exist. Pushes on main queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; only the job that pushes the image may write packages
# (audit, 26.10.2026 — the build job runs code from pull requests and has no
# business with the registry).
permissions:
  contents: read

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Must match `FROM node:<version>-alpine` in frontend/Dockerfile.
          # Dependabot bumps only that one (the docker ecosystem reads Dockerfiles)
          # and nobody touches this number — after the 24 → 26 bump in #31 CI stayed
          # on 24 and for a while tested the code on a different version than
          # production runs. On the next Node major change BOTH places at once.
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # BLOCKING. `--omit=dev` is the point here, not a narrowing: the production
      # image is `output: standalone`, so only production dependencies reach it.
      # Without the flag the audit reported advisories in eslint itself and its
      # tree (js-yaml, brace-expansion) — things that never leave the CI machine —
      # so the gate sat on `continue-on-error` and guarded nothing. Narrowed to
      # what actually goes to the server, it shows zero and can fail the build.
      - name: npm audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    needs: lint-typecheck-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/anovastudio-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          # SITE_URL is a repository variable, set once the real domain exists;
          # bakes the base URL for sitemap/robots/canonicals into the image.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'http://localhost:3000' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # CVE scan of the image's system layer (what npm audit does not see).
      # Informational for now (exit-code 0 = does not block the deploy). ignore-unfixed
      # cuts the noise of vulnerabilities without a patch; what stays can be fixed by
      # bumping the base image. Once the results are clean, set exit-code to 1 so
      # high/critical fail the build.
      - name: Trivy image scan (high+)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # The image name must be lowercase (the owner NextStepProDev has capitals, and an
          # OCI reference requires lowercase — metadata-action lowercases on push by itself).
          image-ref: ghcr.io/nextstepprodev/anovastudio-frontend:${{ steps.version.outputs.version }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
