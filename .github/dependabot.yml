version: 2
updates:
  # Frontend (Next.js)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Grupuj drobne/patch bumpy w jeden PR, żeby nie zasypać przeglądu.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Backend (Strapi)
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Akcje GitHub w workflowach CI/CD
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Obrazy bazowe w Dockerfile'ach
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
