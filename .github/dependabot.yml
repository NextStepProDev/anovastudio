version: 2
updates:
  # Frontend (Next.js)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # ESLint musi zostać na 9.x. `eslint-config-next` deklaruje peer
      # `eslint >=9`, więc npm wpuszcza 10 bez ostrzeżenia, ale dociągnięty
      # razem z nim `eslint-plugin-react` woła `context.getFilename()` —
      # API usunięte w ESLint 10. Lint pada wtedy od razu:
      # "Error while loading rule 'react/display-name'".
      # Odblokować dopiero, gdy Next zacznie bundlować wtyczkę zgodną z 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      # Grupuj drobne/patch bumpy w jeden PR, żeby nie zasypać przeglądu.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Backend (Strapi)
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript musi zostać na 5.x — tyle używa sam Strapi (@strapi/strapi
      # zależy od TS 5.9) i pod taką wersję generuje tsconfig. Bump do 7 wszedł
      # niezauważony, bo `strapi build` kompiluje własnym TS-em; łamał za to
      # każde `npx tsc` w tym katalogu (`moduleResolution: Node` zniknęło w TS 7).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # React 19 wymaga panelu admina Strapi zbudowanego pod 19 — idzie razem
      # z majorem Strapi, nie osobno.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      # react-router-dom siedzi w package.json tylko dlatego, że Strapi
      # scaffolduje go pod panel admina — nic w src/ go nie importuje.
      # @strapi/admin trzyma go w peer jako `^6.30.3`, więc bump do 7 wywala
      # `npm ci` na ERESOLVE. Ta wersja idzie razem z majorem Strapi.
      - dependency-name: react-router-dom
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Akcje GitHub w workflowach CI/CD
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Obrazy bazowe w Dockerfile'ach
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly

  # Obrazy w plikach compose — postgres i nginx. To ŚWIADOMIE osobne wpisy:
  # ekosystem `docker` powyżej czyta wyłącznie Dockerfile'e, a pliki compose
  # obsługuje u Dependabota inny ekosystem, `docker-compose`. Bez tych dwóch
  # pozycji postgres i nginx nie dostawały żadnych aktualizacji — i nie
  # dostały ani jednej przez całe życie repo (nginx stał na 1.27, gdy było
  # już 1.31).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: monthly
    ignore:
      # Postgres tylko w obrębie majora. Przeskok 16 → 17 to migracja danych,
      # nie podmiana obrazu — na maszynie z 1 GB RAM i bez backupów robi się
      # to świadomie i ręcznie, a nie merge'em PR-a od bota.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
