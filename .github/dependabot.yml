version: 2
# Packages that only work at matching versions have their own groups, majors included, and
# sit above minor-and-patch (Dependabot puts an update into the first group that matches).
# Without them a coupled update arrives as several PRs that each fail on their own — in
# next-step-pro-climbing on 2026-11-19 react-i18next 18 needed i18next 27, and each PR was red.
#
# Every Monday at 06:00 Warsaw time, the same slot in all of the owner's projects, so the week's
# dependency PRs from every repo land together and get cleared in one sitting. `time` is not
# decoration: without it Dependabot picks a random hour per repo. Fresh releases wait out
# Dependabot's default 3-day cooldown (security updates do not).
updates:
  # Frontend (Next.js)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    ignore:
      # ESLint must stay on 9.x. `eslint-config-next` declares the peer `eslint >=9`, so npm
      # lets 10 in without a warning, but the `eslint-plugin-react` it pulls in calls
      # `context.getFilename()` — an API removed in ESLint 10. Lint then fails at once:
      # "Error while loading rule 'react/display-name'".
      # Unblock only when Next bundles a plugin that works with 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      next:
        patterns: ["next", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Backend (Strapi)
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    ignore:
      # TypeScript must stay on 5.x — that is what Strapi itself uses (@strapi/strapi depends
      # on TS 5.9) and the version its generated tsconfig targets. A bump to 7 got in
      # unnoticed, because `strapi build` compiles with its own TS; it broke every `npx tsc`
      # in this directory instead (`moduleResolution: Node` is gone in TS 7).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # React 19 needs a Strapi admin panel built for 19 — it comes with a Strapi major, not
      # on its own. Even Strapi 5.63 declares `react ^18` as the panel's peer.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      # react-router-dom is in package.json only because Strapi scaffolds it for the admin
      # panel — nothing in src/ imports it. @strapi/admin keeps it as a peer `^6.30.3`, so a
      # bump to 7 breaks `npm ci` with ERESOLVE. It moves together with a Strapi major.
      - dependency-name: react-router-dom
        update-types: ["version-update:semver-major"]
    groups:
      # All @strapi/* packages are pinned to one exact version and must move together.
      strapi:
        patterns: ["@strapi/*"]
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions in the CI/CD workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    # One PR for all actions, as in the other projects — weekly, ungrouped, every action bump
    # would be a PR of its own.
    groups:
      github-actions:
        patterns:
          - "*"

  # Base images in the Dockerfiles
  # Both run on `node:26-alpine`, a floating tag that already picks up every 26.x on rebuild, so
  # the only PR Dependabot could open here is a jump to the next major. Odd Node majors (27, 29)
  # never get LTS and die after about seven months, and the PR would bump only the Dockerfile,
  # leaving `node-version: 26` in ci-frontend.yml and ci-backend.yml behind. Changing the Node
  # line is a decision: both Dockerfiles and both workflows together.
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # Images in the compose files — postgres and nginx. These are DELIBERATELY separate
  # entries: the `docker` ecosystem above reads only Dockerfiles, and compose files are
  # handled by another Dependabot ecosystem, `docker-compose`. Without these two entries
  # postgres and nginx got no updates at all — not a single one in the repo's whole life
  # (nginx sat on 1.27 when 1.31 was out).
  #
  # The Postgres major block must be in BOTH entries. Both compose files mount a persistent
  # volume at /var/lib/postgresql/data, and Postgres refuses to start when the data
  # directory was created by another major ("database files are incompatible with
  # server"). A major bump is a data migration — dump with the old version, drop the
  # volume, load into the new one — so merging the PR alone ends with a database that does
  # not start. Dev stays on the same version as production; a mismatch here would mean
  # testing on a different database engine.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
